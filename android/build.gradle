group = "uz.alif.jivo_connector"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // One of the SDK's own dependencies (PhotoView) is published only here.
        maven { url = uri("https://www.jitpack.io") }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "uz.alif.jivo_connector"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    // The SDK's screens are built with data binding and need its runtime.
    buildFeatures {
        dataBinding = true
    }
}

dependencies {
    implementation("com.jivosite.sdk:android-sdk:3.0.0-rc01")
    // For the chat screen's own night mode; the SDK already brings it along.
    implementation("androidx.appcompat:appcompat:1.7.0")
}
